'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], clone=x=>JSON.parse(JSON.stringify(x)), uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const initialEntries=[];
const sections=[{id:'education',name:bi('教育背景','Education')},{id:'work',name:bi('实习经历','Experience')},{id:'projects',name:bi('项目经历','Projects')},{id:'awards',name:bi('竞赛经历','Competitions & Awards')},{id:'skills',name:bi('个人技能','Skills')}];
const baseProfile={name:bi('',''),headline:bi('',''),phone:'',email:'',location:bi('',''),photo:''};
function makeVersion(name,excluded=[]){return{id:uid(),name,lang:'zh',order:initialEntries.map(e=>e.id),hidden:excluded,hiddenBullets:[],overrides:{},sectionNames:{},profile:{},style:{font:12,line:1.55,margin:16,accent:'#293f6c',photo:false}}}
const defaultState={schema:1,entries:initialEntries,sections,profile:baseProfile,versions:[makeVersion('版本 1')],active:''};defaultState.active=defaultState.versions[0].id;
let state=clone(defaultState),tab='current',styleOpen=false,history=[],dragId=null,storageOK=true;
let hadLegacyData=false;const KEY='resume-studio-v1';try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(valid(data)){state=data;hadLegacyData=true};}}catch(e){storageOK=false}
function valid(x){return x&&x.schema===1&&Array.isArray(x.entries)&&Array.isArray(x.sections)&&Array.isArray(x.versions)&&x.versions.length&&x.profile&&x.versions.some(v=>v.id===x.active)&&x.entries.every(e=>e.id&&e.title&&e.role&&Array.isArray(e.bullets)&&e.bullets.every(b=>b.id&&b.text))&&x.versions.every(v=>v.id&&Array.isArray(v.order)&&Array.isArray(v.hidden)&&Array.isArray(v.hiddenBullets)&&v.overrides&&v.style&&v.profile&&v.sectionNames)}
const v=()=>state.versions.find(x=>x.id===state.active),lang=()=>v().lang,text=o=>(typeof o==='object'?(o?.[lang()]||''):o)||'',resolved=e=>({...e,...v().overrides[e.id]}),profile=()=>({...state.profile,...v().profile});
function checkpoint(){history.push(clone(state));if(history.length>35)history.shift()}
function save(){if(!hadLegacyData)return;try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;$('#saveState').textContent='● 已保存在本机'}catch(e){storageOK=false;$('#saveState').textContent='未保存 · 请导出备份'}$('#undoBtn').disabled=!history.length}
function change(fn){checkpoint();fn();save();render()}
function toast(s){$('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),4500)}
function selected(e){return!v().hidden.includes(e.id)}
function ordered(){return[...state.entries].sort((a,b)=>{const ai=v().order.indexOf(a.id),bi=v().order.indexOf(b.id);return(ai<0?999:ai)-(bi<0?999:bi)})}
function toggle(arr,id,on){const i=arr.indexOf(id);if(on&&i>=0)arr.splice(i,1);if(!on&&i<0)arr.push(id)}
function render(){ $('#versionSelect').innerHTML=state.versions.map(x=>`<option value="${esc(x.id)}" ${x.id===state.active?'selected':''}>${esc(x.name)}</option>`).join('');$$('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang()));$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#contentBtn').classList.toggle('active',!styleOpen);$('#styleBtn').classList.toggle('active',styleOpen);$('#sideHint').textContent=styleOpen?'排版设置仅影响当前版本。':tab==='library'?'在这里积累全部经历。修改库内容会同步至未单独改写的版本。':'勾选内容，拖动经历调整顺序。编辑只影响当前版本。';renderSidebar();renderPaper()}
function renderSidebar(){if(styleOpen){renderStyles();return}const query=$('#search').value.toLowerCase();$('#library').innerHTML=state.sections.map(s=>{const entries=ordered().filter(e=>e.section===s.id&&JSON.stringify(e).toLowerCase().includes(query));return `<section class="section"><div class="section-head"><span>${esc(text(s.name)||s.name.zh)}</span><button class="mini" data-section-name="${s.id}" title="修改栏目标题">✎</button><button class="mini" data-new="${s.id}" title="添加经历">＋</button></div>${entries.map(raw=>{const e=tab==='library'?raw:resolved(raw);return`<div class="entry ${selected(e)?'selected':''}" draggable="true" data-drag="${e.id}"><div class="entry-top"><span class="handle" title="拖动排序">⠿</span>${tab==='current'?`<input type="checkbox" aria-label="选择 ${esc(text(e.title))}" data-entry="${e.id}" ${selected(e)?'checked':''}>`:''}<span class="entry-name">${esc(text(e.title)||e.title.zh||'未命名')}</span><button class="mini" data-edit="${e.id}" title="编辑经历">✎</button></div><div class="sub">${esc(text(e.role))} ${esc(e.date)} ${v().overrides[e.id]&&tab==='current'?'· 已单独编辑':''}</div>${e.bullets.map(b=>`<label class="bullet-option">${tab==='current'?`<input type="checkbox" data-bullet="${b.id}" ${!v().hiddenBullets.includes(b.id)?'checked':''}>`:'<span>·</span>'}<span>${esc(text(b.text)||'待补充英文')}</span></label>`).join('')}</div>`}).join('')}<button class="mini" style="margin:0 10px 8px;color:var(--navy)" data-new="${s.id}">＋ 添加经历</button></section>`}).join('')+`<button class="add" id="addSection">＋ 添加自定义模块</button>`;$('#addSection').onclick=()=>{const name=prompt('新模块名称，例如：校园经历');if(name?.trim())change(()=>state.sections.push({id:uid(),name:bi(name.trim(),name.trim())}))};$$('[data-new]').forEach(b=>b.onclick=()=>editEntry(null,b.dataset.new));$$('[data-edit]').forEach(b=>b.onclick=()=>editEntry(b.dataset.edit));$$('[data-section-name]').forEach(b=>b.onclick=()=>{const s=state.sections.find(s=>s.id===b.dataset.sectionName);const name=prompt('当前版本的栏目标题',v().sectionNames[s.id]?.[lang()]||text(s.name));if(name?.trim())change(()=>{v().sectionNames[s.id]={...(v().sectionNames[s.id]||s.name),[lang()]:name.trim()}})});$$('[data-entry]').forEach(b=>b.onchange=()=>change(()=>toggle(v().hidden,b.dataset.entry,b.checked)));$$('[data-bullet]').forEach(b=>b.onchange=()=>change(()=>toggle(v().hiddenBullets,b.dataset.bullet,b.checked)));$$('[data-drag]').forEach(el=>{el.ondragstart=e=>{dragId=el.dataset.drag;e.dataTransfer.setData('text/plain',dragId)};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const to=el.dataset.drag,source=state.entries.find(x=>x.id===dragId),target=state.entries.find(x=>x.id===to);if(!source||source.section!==target.section||dragId===to)return;change(()=>{const order=ordered().map(x=>x.id);order.splice(order.indexOf(dragId),1);order.splice(order.indexOf(to),0,dragId);v().order=order})}})}
function ed(s,type,id='',bid=''){return`<span class="editable" contenteditable="true" spellcheck="false" data-field="${type}" data-id="${id}" data-bid="${bid}">${esc(s)}</span>`}
function renderPaper(){const p=profile(),style=v().style;$('#paper').style.cssText=`font-size:${style.font}pt;line-height:${style.line};padding:15mm ${style.margin}mm;--accent:${style.accent};zoom:${$('#zoom').value}`;$('#paper').innerHTML=`<div class="cv-header">${style.photo&&p.photo?`<img class="photo" src="${esc(p.photo)}" alt="个人照片">`:''}<div class="cv-name">${ed(text(p.name),'name')}</div><div class="cv-title">${ed(text(p.headline),'headline')}</div><div class="cv-contact">${esc([p.phone,p.email,text(p.location)].filter(Boolean).join('  ·  '))}</div></div>`+state.sections.map(s=>{const entries=ordered().filter(e=>e.section===s.id&&selected(e));if(!entries.length)return'';return`<section class="cv-section"><h2>${ed(text(v().sectionNames[s.id]||s.name),'section',s.id)}</h2>${entries.map(raw=>{const e=resolved(raw);return`<div class="cv-entry"><div class="cv-entry-heading">${ed(text(e.title)||'待补充英文','title',e.id)}<span class="cv-date">${ed(lang()==='en'?e.date.replace('至今','Present'):e.date,'date',e.id)}</span></div>${text(e.role)?`<div class="cv-role">${ed(text(e.role),'role',e.id)}</div>`:''}<ul>${e.bullets.filter(b=>!v().hiddenBullets.includes(b.id)).map(b=>`<li>${ed(text(b.text)||'待补充英文','bullet',e.id,b.id)}</li>`).join('')}</ul></div>`}).join('')}</section>`}).join('');$$('[contenteditable]').forEach(el=>{el.onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))};el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}};el.onblur=()=>{const val=el.innerText.trim(),old=el.dataset.old;if(old===undefined||val===old)return;checkpoint();const field=el.dataset.field,id=el.dataset.id;if(field==='name'||field==='headline')v().profile[field]={...profile()[field],[lang()]:val};else if(field==='section'){const sec=state.sections.find(s=>s.id===id);v().sectionNames[id]={...(v().sectionNames[id]||sec.name),[lang()]:val}}else{const e=clone(resolved(state.entries.find(x=>x.id===id)));if(field==='bullet')e.bullets.find(b=>b.id===el.dataset.bid).text[lang()]=val;else if(field==='date')e.date=val;else e[field][lang()]=val;v().overrides[id]=e}save();renderSidebar();measure()};el.onfocus=()=>el.dataset.old=el.innerText.trim()});requestAnimationFrame(measure)}
function measure(){const paper=$('#paper'),height=paper.getBoundingClientRect().height/Number($('#zoom').value),page=297*96/25.4,over=height>page+3;$('#pageStatus').textContent='A4 · '+(over?'超过 1 页':'1 页');$('#overflowStatus').className=over?'warn':'ok';$('#overflowStatus').textContent=over?'● 超出约 '+Math.ceil((height-page)*25.4/96)+' mm · 请精简内容或调整样式':'● 内容未超页'}

function databaseAll(){return new Promise((resolve,reject)=>{const tx=projectDB.transaction('projects','readonly'),r=tx.objectStore('projects').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function databasePut(record,expectedRevision){return new Promise((resolve,reject)=>{
  const tx=projectDB.transaction('projects','readwrite'),store=tx.objectStore('projects');let result,conflict=false;
  const read=store.get(record.id);read.onsuccess=()=>{const actual=read.result?.revision||0;if(expectedRevision!==undefined&&actual!==expectedRevision){conflict=true;tx.abort();return}result={...record,revision:actual+1};store.put(result)};
  tx.oncomplete=()=>resolve(result);tx.onabort=()=>reject(new Error(conflict?'项目在另一个页面已更新，请先导出本页项目文件，再刷新。':(tx.error?.message||'项目保存失败')));tx.onerror=()=>{};
})}
function queueWrite(task){pendingWrites++;const job=writeQueue.then(task);writeQueue=job.catch(()=>{});return job.finally(()=>pendingWrites--)}
const activeProject=()=>projects.get(activeProjectId);
function displaySave(message,success=true){$('#saveState').textContent=message;$('#saveState').style.color=success?'':'#ab633c'}
save=function(){
  migrateV2();$('#undoBtn').disabled=!history.length;
  if(!activeProjectId)return Promise.resolve(true);
  const id=activeProjectId,snapshot=clone(state);
  if(conflictedProjects.has(id)){storageOK=false;displaySave('未保存 · 请导出项目文件',false);return Promise.resolve(false)}
  displaySave('正在保存…');
  return queueWrite(async()=>{
    const current=projects.get(id);const result=await databasePut({...current,data:snapshot,updatedAt:new Date().toISOString()},current.revision);
    projects.set(id,result);if(activeProjectId===id){storageOK=true;displaySave('● 项目已保存')};return true;
  }).catch(error=>{storageOK=false;if(error.message.includes('另一个页面'))conflictedProjects.add(id);if(activeProjectId===id)displaySave('未保存 · 请导出项目文件',false);toast(error.message);return false});
};
function portable(record,data=record.data){return{kind:'resume-project',formatVersion:1,name:record.name,exportedAt:new Date().toISOString(),data}}
function projectFilename(name){return (name||'简历项目').replace(/[\\/:*?"<>|]/g,'_')+'.resume.json'}
function exportProject(id=activeProjectId){document.activeElement?.blur();const record=projects.get(id);if(!record)return;download(projectFilename(record.name),JSON.stringify(portable(record,id===activeProjectId?state:record.data),null,2),'application/json');toast('项目文件已导出，包含所有经历、版本、课程和照片')}
async function showProject(id){
  document.activeElement?.blur();await writeQueue;const record=projects.get(id);if(!record)return;
  activeProjectId=id;state=clone(record.data);history=[];tab='current';styleOpen=false;folded=new Set(['education','skills']);$('#search').value='';
  document.body.dataset.mode='editing';$('#projectName').textContent=record.name;document.title=record.name+' · 简历编辑';render();save();
}
async function goHome(){document.activeElement?.blur();await writeQueue;if(activeProjectId&&!storageOK){toast('当前修改尚未保存，请先导出项目文件');return}activeProjectId=null;history=[];document.body.dataset.mode='home';document.title='我的简历项目';const records=await databaseAll();projects=new Map(records.map(p=>[p.id,p]));renderHome()}
function miniature(theme,name,subtitle=''){return`<div class="template-preview preview-${theme.id}" style="--swatch:${theme.color}"><b>${esc(name)}</b><em>${esc(subtitle)}</em><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>`}
function projectTheme(record){const ver=record.data.versions.find(v=>v.id===record.data.active)||record.data.versions[0];return THEMES.find(t=>t.id===ver.style.template)||THEMES[0]}
function projectPerson(record){const ver=record.data.versions.find(v=>v.id===record.data.active)||record.data.versions[0];const p={...record.data.profile,...ver.profile};return p.name?.zh||p.name?.en||'未填写姓名'}

function renderHome(){

  const list=[...projects.values()].filter(p=>Boolean(p.archived)===archived&&(`${p.name} ${projectPerson(p)}`).toLowerCase().includes(homeSearch.toLowerCase())).sort((a,b)=>homeSort==='name'?a.name.localeCompare(b.name,'zh-CN'):b.updatedAt.localeCompare(a.updatedAt));

t-card-info"><div class="project-title-line"><h3>${esc(p.name)}</h3><button class="project-menu" data-manage-project="${p.id}" aria-label="管理 ${esc(p.name)}">···</button></div><div class="project-stats">${p.data.versions.length} 个版本 <span style="margin:0 5px;color:#c8cdd3">/</span> ${p.data.entries.length} 条经历</div><div class="project-meta"><span class="project-tag">${t.name}</span><span>${relativeDate(p.updatedAt)}</span></div></div></article>`}).join('')}${!archived?'<button class="project-create" id="createCard"><span class="plus">＋</span><span>创建新的简历项目</span><small>从空白开始，或复制已有项目</small></button>':!list.length?'<div class="home-empty">还没有归档项目</div>':''}</div>`}<div class="home-guide"><strong>随时带走你的项目</strong><p>“保存项目文件”导出可继续编辑的 .resume.json；“导出 HTML / PDF”生成用于投递的简历。打开项目文件会创建独立副本，不覆盖已有项目。</p></div></div></div>`;
  $$('[data-home-view]').forEach(el=>el.onclick=()=>{homeView=el.dataset.homeView;homeSearch='';renderHome()});

}

const v6EditCourseBase=editCourse;editCourse=function(id){const existing=state.courses.find(c=>c.id===id),c=clone(existing||{id:uid(),name:bi('',''),score:'',status:'pending',credits:0,term:''});$('#editor').close();openDialog(`<h2>${id?'编辑':'新增'}课程</h2><form><div class="form-grid">${field('课程名称','zh',c.name.zh,true)}${field('英文名称（选填）','en',c.name.en,true)}${field('成绩（选填，可填“通过”）','score',c.status==='pass'?'通过':c.score,true)}</div><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary">保存</button></div></form>`,d=>{if(!String(d.get('zh')).trim()&&!String(d.get('en')).trim())return toast('请输入课程名称');const score=String(d.get('score')).trim();change(()=>{c.name=bi(String(d.get('zh')).trim(),String(d.get('en')).trim());c.status=/^(P|Pass|通过)$/i.test(score)?'pass':score?'graded':'pending';c.score=c.status==='pass'?'P':score;if(existing)state.courses[state.courses.indexOf(existing)]=c;else{state.courses.push(c);state.versions.forEach(w=>{w.courses=w.courses||{...clone(courseDefaults),selected:[]};if(w.courses.autoLink){w.courses.enabled=true;w.courses.selected=w.courses.selected||[];if(!w.courses.selected.includes(c.id))w.courses.selected.push(c.id);if(!w.courses.educationId)w.courses.educationId=state.entries.find(e=>e.section==='education')?.id||''}})}});setTimeout(showCourses,0)})};

/* Restore the original version manager: rename and delete remain available. */
$('#versionMenu').textContent='⋯';$('#versionMenu').title='重命名或删除版本';$('#versionMenu').onclick=()=>{openDialog(`<h2>管理当前版本</h2><form><div class="form-grid">${field('版本名称','name',v().name,true)}</div><div class="dialog-actions"><button type="button" class="danger" id="deleteVersion">删除版本</button><button type="button" data-close>取消</button><button class="primary">保存</button></div></form>`,d=>change(()=>v().name=String(d.get('name')).trim()||v().name));$('#deleteVersion').onclick=()=>{if(state.versions.length===1)return toast('至少保留一个版本');if(!confirm('删除当前版本？经历库会保留。'))return;change(()=>{state.versions=state.versions.filter(w=>w.id!==state.active);state.active=state.versions[0].id});$('#editor').close()}};
/* Keep the public entry screen in the requested v4 shape: exactly two choices. */
renderHome=v6SimpleHome;
if(projectDB)renderHome();
/* v8: keep the v4 entry screen while tightening the remaining project and
   editor interactions.  These overrides are intentionally additive so old
   .resume.json files continue to load. */
const v8PageConfig=pageConfig;
pageConfig=function(){
  const c=v()?.style?.page||{kind:'A4',width:210,height:297};
  const requested=c.kind==='custom'?'A4':c.kind;
  const kind=[...Object.keys(pagePresets),'long'].includes(requested)?requested:'A4';
  const preset=pagePresets[kind];
  if(preset)return{kind,width:preset[0],height:preset[1]};
  return{kind,width:clamp(c.width,100,420,210),height:0};
};

function v8CleanPageControls(){
  ['#pageQuickKind','#pageKind'].forEach(selector=>{
    const select=$(selector);if(!select)return;
    select.querySelector('option[value="custom"]')?.remove();
    if(!['A4','A5','A3','long'].includes(select.value))select.value='A4';
  });
}
const v8RenderStyles=renderStyles;
renderStyles=function(){
  v8RenderStyles();
  v8CleanPageControls();
  const select=$('#pageKind');
  if(select)select.onchange=e=>change(()=>{
    const kind=e.target.value,c=pageConfig(),dimensions=pagePresets[kind]||[c.width,0];
    v().style.page={kind,width:dimensions[0],height:dimensions[1]};boundPhoto(v().style.photoLayout);
  });
};
v8CleanPageControls();

/* Built-in sample resumes should open once per character/layout, not create a
   new hidden duplicate on every click. */
const v8OpenSample=v6OpenSample;
v6OpenSample=async function(sampleId,themeId){
  const sample=V6_SAMPLE_MAP[sampleId],theme=THEMES.find(t=>t.id===themeId)||THEMES[0];
  if(!sample)return;
  const existing=[...projects.values()].find(p=>p.data?.sampleId===sample.id&&p.data?.versions?.some(w=>w.style?.template===theme.id));
  if(existing){$('#editor')?.close();await showProject(existing.id);toast('已打开现有比奇堡示例项目，可直接编辑');return;}
  return v8OpenSample(sampleId,themeId);
};

/* Modern sidebar: education and skills are the visible left rail; all
   experience sections occupy a clearly separated right column. */
const v8PaperBase=renderPaper;
renderPaper=function(){
  v8PaperBase();
  const paper=$('#paper');
  if(!paper||v().style.template!=='sidebar')return;
  const columns=paper.querySelector(':scope > .cv-columns')||document.createElement('div');
  const sections=[...new Set([
    ...paper.querySelectorAll(':scope > .cv-section'),
    ...columns.querySelectorAll(':scope > .cv-section, :scope > .cv-secondary > .cv-section, :scope > .cv-primary > .cv-section')
  ])];
  if(!sections.length)return;
  columns.className='cv-columns cv-sidebar-columns';
  const secondary=document.createElement('div'),primary=document.createElement('div');
  secondary.className='cv-secondary';primary.className='cv-primary';
  sections.forEach(section=>{
    const id=section.querySelector('[data-field="section"]')?.dataset.id;
    (['education','skills'].includes(id)?secondary:primary).append(section);
  });
  columns.replaceChildren(secondary,primary);
  paper.append(columns);
  requestAnimationFrame(measure);
};

/* Keep the template cards honest too: the sidebar card previews the same split
   used by the editor, while the other themes retain their own layout. */
const v8SamplePreviewBase=v6SamplePreview;
v6SamplePreview=function(theme,sample){
  if(theme.id!=='sidebar')return v8SamplePreviewBase(theme,sample);
  const entries=v6PreviewEntries(sample),skills=sample.entries.find(e=>e.section==='skills');
  const label=e=>e.section==='education'?bi('教育背景','Education'):e.section==='work'?bi('工作经历','Experience'):bi('项目经历','Projects');
  const section=e=>`<section class="sample-section"><h4>${esc(v6SampleText(label(e)))}</h4><div class="sample-entry"><header><b>${esc(v6SampleText(e.title))}</b><span>${esc(e.date)}</span></header><p>${esc(v6SampleText(e.role))}</p><ul>${e.bullets.slice(0,2).map(b=>`<li>${esc(b[0])}</li>`).join('')}</ul></div></section>`;
  const left=entries.filter(e=>e.section==='education').map(section).join('')+(skills?`<section class="sample-section"><h4>个人技能</h4><p>${esc(v6SampleText(skills.role))}</p></section>`:'');
  const right=entries.filter(e=>e.section!=='education').map(section).join('');
  return`<div class="sample-paper sample-sidebar" style="--sample-accent:${theme.color}"><div class="sample-head"><div><h3>${esc(v6SampleText(sample.name))}</h3><p>${esc(v6SampleText(sample.headline))}</p><small>${esc(sample.email)}　${esc(v6SampleText(sample.location))}</small></div><div class="sample-avatar">${sample.photo?`<img src="${esc(sample.photo)}" alt="${esc(v6SampleText(sample.name))}">`:esc(sample.avatar)}</div></div><div class="sample-columns sample-sidebar-columns"><div class="sample-secondary">${left}</div><div class="sample-primary">${right}</div></div></div>`;
};

/* No copy/archive controls in the v4 flow.  Creating a project always starts
   from a clean workspace and a chosen visual template. */
function v8NewProjectDialog(themeId='blue'){
  const theme=THEMES.find(t=>t.id===themeId)||THEMES[0];
  openDialog(`<h2>从已有模板创建</h2><p class="project-import-note">选择排版，填写姓名后即可打开一份可编辑项目。</p><form><div class="form-grid">${field('项目名称','projectName','',true)}${field('姓名','owner','',true)}<label class="field wide">模板<select name="theme">${THEMES.map(t=>`<option value="${esc(t.id)}" ${t.id===theme.id?'selected':''}>${esc(t.name)} — ${esc(t.desc)}</option>`).join('')}</select></label></div><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary">创建并打开</button></div></form>`,d=>{
    const name=String(d.get('projectName')).trim(),owner=String(d.get('owner')).trim(),selectedTheme=THEMES.find(t=>t.id===d.get('theme'))||THEMES[0];
    addProject(name||((owner||'未命名')+'的简历'),blankWorkspace(owner,selectedTheme)).then(p=>showProject(p.id)).catch(e=>toast('项目创建失败：'+e.message));
  });
  $('#editor [name="projectName"]')?.focus();
}
newProjectDialog=v8NewProjectDialog;

function v8ManageProject(id){
  const record=projects.get(id);if(!record)return;
  openDialog(`<h2>项目名称</h2><form><div class="form-grid">${field('项目名称','name',record.name,true)}</div><p class="hint">项目文件可从编辑页顶部“保存项目文件”导出。</p><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary">保存名称</button></div></form>`,d=>{
    const name=String(d.get('name')).trim();if(!name)return;
    queueWrite(async()=>{const current=projects.get(id),saved=await databasePut({...current,name,updatedAt:new Date().toISOString()},current.revision);projects.set(id,saved);if(activeProjectId===id)$('#projectName').textContent=name}).catch(e=>toast(e.message));
  });
}
manageProject=v8ManageProject;
$('#projectName').onclick=()=>v8ManageProject(activeProjectId);

/* The saved-state pill is not part of the v4 UI. */
$('#saveState')?.setAttribute('hidden','');

/* Align the arrow and drag handle, and expose an explicit selected state for
   the photo's left/right segmented control. */
const v8EditPhotoBase=editPhoto;
editPhoto=function(){
  v8EditPhotoBase();
  const left=$('#photoLeft'),right=$('#photoRight');
  if(!left||!right)return;
  left.classList.add('photo-align-option');right.classList.add('photo-align-option');
  const select=which=>{left.classList.toggle('selected',which==='left');right.classList.toggle('selected',which==='right')};
  left.addEventListener('click',()=>select('left'));right.addEventListener('click',()=>select('right'));
  const layout=v().style.photoLayout||{},frame=typeof bodyWidth==='function'?bodyWidth():0;
  select(Number(layout.x)>=frame-Number(layout.width)-.5?'right':'left');
};

/* Remove the phrase “修改当前版本” from the already-built experience dialog
   without changing the library/current-version behavior. */
const v8EditEntryBase=editEntry;
editEntry=function(...args){
  const result=v8EditEntryBase(...args),hint=$('#editor .hint');
  if(hint)hint.textContent=hint.textContent.replace('修改当前版本；','');
  return result;
};

function v8AiPrompt(){return`请严格按照下载的 JSON 样例填充一份可编辑简历。\n\n要求：\n1. 保留 kind、formatVersion、data、schema、sections、versions、active 及所有字段层级；不要改字段名。\n2. 中英文内容逐条对应：中文写入 zh，英文写入 en；日期、机构、职位与项目名称保持语义一致。\n3. 每条经历必须使用唯一 id，并通过 section 归入 education、work、projects、awards 或 skills；描述按一条一个 bullet 写入。\n4. 只补充或修改简历内容与个人信息，不删除排版设置、版本结构、课程库或照片字段。\n5. 返回完整 JSON 文件，不要 Markdown 代码块、解释文字或额外字段。`}
function v8DownloadAiSample(){
  const theme=THEMES.find(t=>t.id==='blue')||THEMES[0],data=blankWorkspace('',theme),record={name:'AI简历填写样例',data};
  download('AI简历填写样例.resume.json',JSON.stringify(portable(record,data),null,2),'application/json');toast('已下载 AI 填写样例');
}
function v8ShowAiTemplate(){
  openDialog(`<h2>用 AI 填写简历</h2><p class="hint">下载样例后，把下面的提示词、JSON，还有你的个人信息/已有简历一起交给 AI；完成后从首页“导入 JSON”打开。</p><textarea id="aiPromptText" readonly style="width:100%;min-height:220px;margin-top:14px;line-height:1.7">${esc(v8AiPrompt())}</textarea><div class="dialog-actions"><span id="copyAiStatus" class="copy-ai-status" aria-live="polite"></span><button type="button" id="copyAiPrompt">复制提示词</button><button type="button" class="primary" id="downloadAiJson">下载样例 JSON</button></div>`);
  const copied=()=>{$('#copyAiStatus').textContent='提示词已复制';$('#copyAiPrompt').focus()};
  $('#copyAiPrompt').onclick=async()=>{try{await navigator.clipboard.writeText(v8AiPrompt());copied()}catch(e){$('#aiPromptText').select();document.execCommand('copy');copied()}};
  $('#downloadAiJson').onclick=()=>v8DownloadAiSample();
}

/* Return-home confirmation: leave without saving or download the current
   .resume.json first. */
const v8LeaveHome=async()=>{document.activeElement?.blur();await writeQueue;activeProjectId=null;history=[];document.body.dataset.mode='home';document.title='我的简历项目';try{projects=new Map((await databaseAll()).map(p=>[p.id,p]))}catch(e){}renderHome()};
goHome=async function(){
  if(!activeProjectId)return v8LeaveHome();
  const record=projects.get(activeProjectId);if(!record)return v8LeaveHome();
  openDialog(`<h2>返回首页</h2><p class="hint">要先保存当前简历项目文件吗？不保存也可以直接返回首页。</p><div class="dialog-actions"><button type="button" id="leaveWithoutSave">直接返回</button><button type="button" class="primary" id="saveAndHome">保存项目文件并返回</button></div>`);
  $('#leaveWithoutSave').onclick=()=>{$('#editor').close();v8LeaveHome()};
  $('#saveAndHome').onclick=async()=>{await save();const latest=projects.get(activeProjectId)||record;download(projectFilename(latest.name),JSON.stringify(portable(latest,state),null,2),'application/json');toast('项目文件已保存');$('#editor').close();await v8LeaveHome()};
};
$('#backToProjects').onclick=goHome;

/* Replace the final v4 start screen with a compact, welcoming two-choice
   surface.  Import remains a local .resume.json file picker. */
v6SimpleHome=function(){
  document.body.dataset.mode='home';document.title='ResuWeave';
  $('#projectHome').innerHTML=`<div class="start-shell"><div class="welcome-copy"><h1>欢迎！开始整理你的简历吧</h1></div><div class="start-grid"><section class="start-card"><h1>打开已有文件</h1><div class="drop-target" id="openResume" role="button" tabindex="0" aria-label="打开简历项目文件"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 15V9h13l5 6h16v25H7z"/><path d="M7 20h34"/></svg><span>选择项目文件，或拖到这里</span><small>.resume.json · 继续编辑</small></div></section><section class="start-card"><h1>从已有模板创建</h1><div class="start-previews">${['blue','classic','sidebar'].map((id,i)=>{const t=THEMES.find(t=>t.id===id),s=v6SampleForTheme(i);return`<div class="start-sample-preview"><div class="sample-thumb">${v6SamplePreview(t,s)}</div></div>`}).join('')}</div><button class="primary" id="chooseTemplate">选择模板 →</button><div class="start-card-tools"><button type="button" id="downloadAiSample">下载 AI 填写样例</button><button type="button" id="importJson">导入 JSON</button></div></section></div></div>`;
  const drop=$('#openResume');drop.onclick=()=>openExisting();drop.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();openExisting()}};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag-over')};drop.ondragleave=()=>drop.classList.remove('drag-over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag-over');if(e.dataTransfer.files[0])importResume(e.dataTransfer.files[0])};
  $('#chooseTemplate').onclick=()=>v6ShowTemplatePicker();$('#downloadAiSample').onclick=v8ShowAiTemplate;$('#importJson').onclick=()=>openExisting();
};
renderHome=v6SimpleHome;
if(projectDB)renderHome();

</script>
